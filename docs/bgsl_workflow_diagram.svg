<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1180" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #475569; }
    .node-lbl { font-size: 14px; font-weight: 600; fill: #0f172a; }
    .node-desc { font-size: 11px; fill: #334155; }
    .fastpath-lbl { font-size: 12px; font-weight: 600; fill: #1e293b; }
    .fastpath-body { font-size: 11px; fill: #334155; }
    .edge-lbl { font-size: 11px; fill: #475569; font-style: italic; }
    .badge { font-size: 10px; font-weight: 700; fill: #ffffff; }
    .caption { font-size: 11px; fill: #64748b; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #0f172a; }
    .node-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.6; rx: 8; }
    .node-box-outer { fill: #ffffff; stroke: #3b82f6; stroke-width: 2; rx: 12; }
    .fastpath-box { fill: #f8fafc; stroke: #94a3b8; stroke-dasharray: 4,3; stroke-width: 1.4; rx: 6; }
    .llm-box { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.6; rx: 8; }
    .action-add { fill: #fef3c7; stroke: #d97706; stroke-width: 1.4; rx: 6; }
    .action-map { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.4; rx: 6; }
    .decision-diamond { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.6; }
    .terminal { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.6; rx: 20; }
    .arrow { fill: none; stroke: #334155; stroke-width: 1.6; }
    .arrow-thick { fill: none; stroke: #334155; stroke-width: 2; }
    .arrow-loop { fill: none; stroke: #ea580c; stroke-width: 1.8; stroke-dasharray: 6,4; }
    .badge-llm { fill: #0891b2; }
    .badge-det { fill: #64748b; }
    .badge-add { fill: #d97706; }
    .badge-map { fill: #16a34a; }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowhead-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- ============ HEADER ============ -->
  <text x="30" y="34" class="title">bGSL entity-resolution workflow</text>
  <text x="30" y="54" class="subtitle">LangGraph pipeline · one query term at a time · loops until all rows in a source are resolved</text>

  <!-- Legend row -->
  <g transform="translate(30,72)">
    <rect x="0"   y="0" width="16" height="12" class="node-box"/>
    <text x="22"  y="10" class="caption">graph node</text>
    <rect x="115" y="0" width="16" height="12" class="fastpath-box"/>
    <text x="137" y="10" class="caption">deterministic fast-path (no LLM)</text>
    <rect x="345" y="0" width="16" height="12" class="llm-box"/>
    <text x="367" y="10" class="caption">LLM step</text>
    <rect x="430" y="0" width="16" height="12" class="action-map"/>
    <text x="452" y="10" class="caption">MAP → merge</text>
    <rect x="555" y="0" width="16" height="12" class="action-add"/>
    <text x="577" y="10" class="caption">ADD → new node</text>
  </g>

  <!-- ============ START ============ -->
  <rect x="410" y="112" width="140" height="34" class="terminal"/>
  <text x="480" y="134" text-anchor="middle" class="node-lbl">START · loop over terms</text>

  <line x1="480" y1="146" x2="480" y2="174" class="arrow-thick" marker-end="url(#arrowhead)"/>

  <!-- ============ 1. RETRIEVE ============ -->
  <rect x="90" y="176" width="780" height="88" class="node-box-outer"/>
  <text x="112" y="200" class="node-lbl">① retrieve</text>
  <circle cx="820" cy="196" r="10" class="badge-det"/>
  <text x="820" y="199.5" text-anchor="middle" class="badge">det</text>
  <text x="112" y="222" class="node-desc">Similarity-search the bGSL seed vectorstore (Chroma, Ollama embeddings) with the query surface form + its own synonyms/abbreviations.</text>
  <text x="112" y="240" class="code">top_k = 5 · score_threshold = 0.3 → returns up to 5 candidates with cosine similarity to the query.</text>
  <text x="112" y="256" class="node-desc">The vector store is <tspan font-weight="700">live-updated</tspan> — every MAP appends the new surface form, every ADD inserts a new document.</text>

  <line x1="480" y1="266" x2="480" y2="294" class="arrow-thick" marker-end="url(#arrowhead)"/>

  <!-- ============ 2. TEXTBOOK LOOKUP ============ -->
  <rect x="90" y="296" width="780" height="88" class="node-box-outer"/>
  <text x="112" y="320" class="node-lbl">② textbook_lookup</text>
  <circle cx="820" cy="316" r="10" class="badge-llm"/>
  <text x="820" y="319.5" text-anchor="middle" class="badge">LLM</text>
  <text x="112" y="342" class="node-desc">Optional RAG over <tspan font-style="italic">Essentials of Glycobiology (4e)</tspan> to fetch biology context when the retrieved candidates alone leave the mapping decision ambiguous.</text>
  <text x="112" y="360" class="fastpath-body">Skipped when top_score &lt; 0.55 (LLM would just ADD) or top_score ≥ 0.7 with margin ≥ 0.05 (candidate is unambiguous).</text>
  <text x="112" y="378" class="node-desc">The LLM decides on its own whether to call the <tspan class="code">query_textbook</tspan> tool; capped at one call per term.</text>

  <line x1="480" y1="386" x2="480" y2="414" class="arrow-thick" marker-end="url(#arrowhead)"/>

  <!-- ============ 3. RESOLVE ============ -->
  <rect x="90" y="416" width="780" height="292" class="node-box-outer"/>
  <text x="112" y="440" class="node-lbl">③ resolve — the decision agent</text>
  <circle cx="820" cy="436" r="10" class="badge-llm"/>
  <text x="820" y="439.5" text-anchor="middle" class="badge">LLM</text>

  <!-- Fast-path block -->
  <rect x="112" y="458" width="360" height="216" class="fastpath-box"/>
  <text x="128" y="478" class="fastpath-lbl">Fast-paths (deterministic, cheap)</text>

  <text x="128" y="502" class="fastpath-body" font-weight="700">→ ADD</text>
  <text x="146" y="502" class="fastpath-body">no candidates returned by retrieve</text>
  <text x="128" y="520" class="fastpath-body" font-weight="700">→ ADD</text>
  <text x="146" y="520" class="fastpath-body">top score &lt; 0.45 AND query has no GTC id</text>
  <text x="128" y="546" class="fastpath-body" font-weight="700">→ MAP · exact_synonym_of</text>
  <text x="146" y="562" class="fastpath-body">normalised surface form (case-fold, strip Greek,</text>
  <text x="146" y="576" class="fastpath-body">strip punctuation) equals a candidate's name or synonym,</text>
  <text x="146" y="590" class="fastpath-body">and vector score ≥ 0.5</text>

  <text x="128" y="618" class="fastpath-body" font-style="italic">Case-sensitive carve-out: "i-antigen" (linear</text>
  <text x="128" y="632" class="fastpath-body" font-style="italic">poly-LacNAc) ≠ "I-antigen" (branched poly-LacNAc).</text>

  <text x="128" y="658" class="fastpath-body" font-weight="700">GTC-ID fast-path: DISABLED.</text>
  <text x="128" y="672" class="fastpath-body">Same GlyTouCan ID ≠ same glycan concept (aglycon</text>
  <text x="128" y="686" class="fastpath-body">and position-in-larger-structure matter).</text>

  <!-- LLM block -->
  <rect x="490" y="458" width="360" height="216" class="llm-box"/>
  <text x="506" y="478" class="fastpath-lbl">LLM resolver (when no fast-path fires)</text>
  <text x="506" y="500" class="fastpath-body">Prompt bundles: query term + its synonyms + description +</text>
  <text x="506" y="514" class="fastpath-body">the top-K candidates + textbook excerpts (if fetched) +</text>
  <text x="506" y="528" class="fastpath-body">curator's suggested_class hint + raw source metadata.</text>

  <text x="506" y="554" class="fastpath-body">Returns a structured JSON:</text>
  <text x="506" y="572" class="code">{"action": "map" | "add",</text>
  <text x="506" y="588" class="code"> "mapped_to_uuid": "GSD:...",</text>
  <text x="506" y="604" class="code"> "edge_type": "exact_synonym_of" | "abbreviation_of"</text>
  <text x="506" y="620" class="code">              | "related_synonym_of" | "broad_synonym_of"</text>
  <text x="506" y="636" class="code">              | "narrow_synonym_of" | "is_a" | "",</text>
  <text x="506" y="652" class="code"> "rationale": "..."}</text>
  <text x="506" y="672" class="fastpath-body" font-style="italic">Bias: "when in doubt, ADD — merges are hard to undo."</text>

  <!-- Arrow from fastpath box to bottom -->
  <line x1="292" y1="674" x2="292" y2="726" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="670" y1="674" x2="670" y2="726" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- ============ 4. REGISTER ============ -->
  <rect x="90" y="728" width="780" height="180" class="node-box-outer"/>
  <text x="112" y="752" class="node-lbl">④ register — write back the decision</text>
  <circle cx="820" cy="748" r="10" class="badge-det"/>
  <text x="820" y="751.5" text-anchor="middle" class="badge">det</text>

  <!-- Two branches -->
  <rect x="112" y="770" width="360" height="120" class="action-add"/>
  <text x="128" y="790" class="fastpath-lbl">action = ADD</text>
  <text x="128" y="810" class="fastpath-body">• mint a fresh GSD:UUID</text>
  <text x="128" y="826" class="fastpath-body">• insert a new document into the vector store</text>
  <text x="128" y="842" class="fastpath-body">• write the decision to <tspan class="code">terms_ai-decisions.jsonl</tspan></text>
  <text x="128" y="858" class="fastpath-body">• (curator-hint edges, if any, still get emitted)</text>
  <text x="128" y="878" class="fastpath-body">Result: a brand-new bGSL concept.</text>

  <rect x="490" y="770" width="360" height="120" class="action-map"/>
  <text x="506" y="790" class="fastpath-lbl">action = MAP</text>
  <text x="506" y="810" class="fastpath-body">• append surface form to the target's synonyms</text>
  <text x="506" y="826" class="fastpath-body">• update the vector-store document in place</text>
  <text x="506" y="842" class="fastpath-body">• write the decision to <tspan class="code">terms_ai-decisions.jsonl</tspan></text>
  <text x="506" y="858" class="fastpath-body">• for related/broad/narrow_synonym_of, is_a:</text>
  <text x="506" y="874" class="fastpath-body">  emit an edge in <tspan class="code">edges_ai-decisions.jsonl</tspan></text>

  <line x1="480" y1="908" x2="480" y2="934" class="arrow-thick" marker-end="url(#arrowhead)"/>

  <!-- ============ 5. ADVANCE ============ -->
  <rect x="330" y="936" width="300" height="58" class="node-box-outer"/>
  <text x="352" y="960" class="node-lbl">⑤ advance</text>
  <circle cx="600" cy="954" r="10" class="badge-det"/>
  <text x="600" y="957.5" text-anchor="middle" class="badge">det</text>
  <text x="352" y="980" class="node-desc">move to next term · clear per-term state</text>

  <!-- Diamond decision -->
  <polygon points="480,1008 570,1050 480,1092 390,1050" class="decision-diamond"/>
  <text x="480" y="1046" text-anchor="middle" class="fastpath-lbl">more terms?</text>
  <text x="480" y="1064" text-anchor="middle" class="caption" font-style="italic">conditional edge</text>

  <line x1="480" y1="994" x2="480" y2="1008" class="arrow-thick" marker-end="url(#arrowhead)"/>

  <!-- Loop back arrow: from diamond left, up around retrieve -->
  <path d="M 390 1050 Q 30 1050 30 220 Q 30 200 90 200" class="arrow-loop" marker-end="url(#arrowhead-loop)"/>
  <text x="42" y="640" class="edge-lbl" transform="rotate(-90 42,640)">yes → back to retrieve (next term)</text>

  <!-- END terminal -->
  <line x1="570" y1="1050" x2="720" y2="1050" class="arrow-thick" marker-end="url(#arrowhead)"/>
  <text x="640" y="1044" text-anchor="middle" class="edge-lbl">no</text>
  <rect x="720" y="1030" width="120" height="40" class="terminal"/>
  <text x="780" y="1055" text-anchor="middle" class="node-lbl">END</text>

  <!-- Footer caption -->
  <text x="30" y="1130" class="caption">One graph run = one source. The seed store keeps growing as each source is processed, so later sources see the union of everything before them.</text>
  <text x="30" y="1146" class="caption">Post-processing then merges the per-source <tspan class="code">terms.jsonl</tspan> + <tspan class="code">edges_ai-decisions.jsonl</tspan> files into a single <tspan class="code">master_nodes.json</tspan> / <tspan class="code">master_edges.json</tspan>.</text>
  <text x="30" y="1162" class="caption">Curator hints from the review xlsx are honoured here — <tspan class="code">exact_synonym_of / abbreviation_of</tspan> collapse into synonym slots on the parent node; the rest emit edges.</text>
</svg>
